[package]
name = "codebook"
version = "0.1.0"
edition = "2021"
description = "A byte-level BPE tokenizer (the GPT kind), trained from scratch and checked token-for-token against tiktoken"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
fancy-regex = "0.14"
base64 = "0.22"
rustc-hash = "2"
unicode-general-category = "1.1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.wasm]
inherits = "release"
opt-level = "z"
strip = true
panic = "abort"
